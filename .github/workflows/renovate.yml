name: Renovate

on:
  schedule:
    # Every Monday at 05:30 UTC (after the 05:00 renovate schedule window opens)
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.3
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          # Reduce log noise; bump to DEBUG for troubleshooting
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
